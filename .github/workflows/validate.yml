name: validate-blueprints
on:
  push:
    branches: [main]
  pull_request:
jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate index and blueprint schema
        run: python scripts/validate_blueprints.py
      - name: Compile Python entrypoint
        run: python -m py_compile python/02_velocity_paga.py

